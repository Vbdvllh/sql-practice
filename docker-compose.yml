services:
  postgres:
    image: postgres:16-alpine
    container_name: sql_practice_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bis_analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_practice_pw}
      POSTGRES_DB: ${POSTGRES_DB:-egypt_commerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bis_analyst} -d $${POSTGRES_DB:-egypt_commerce}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
